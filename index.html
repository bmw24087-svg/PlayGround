<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Voxel Isle</title>
  <style>
    :html,body{height:100%} *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#87ceeb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white;user-select:none;-webkit-user-select:none} canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #0008} #brand{position:absolute;left:22px;top:17px;font-weight:900;font-size:24px;letter-spacing:-1px}.branddot{color:#ffe56b}
    #timeCard{position:absolute;right:22px;top:18px;text-align:right}.timeLabel{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:800}.timeRow{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:800;margin-top:3px}.sun{width:20px;height:20px;border-radius:50%;background:#ffe478;box-shadow:0 0 12px #fff59a}
    #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 1px 2px #000}.crosshair:before{} #crosshair:before{width:2px;height:18px;left:8px}#crosshair:after{height:2px;width:18px;top:8px}
    #hotbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;background:#1b2b38aa;border:3px solid #fff8;backdrop-filter:blur(5px);padding:5px;border-radius:8px;pointer-events:auto}.slot{width:54px;height:54px;border:2px solid #fff4;border-radius:5px;position:relative;background:#24384799}.slot.active{border-color:#fff;transform:translateY(-4px);box-shadow:0 5px 12px #0005}.slot b{position:absolute;left:5px;bottom:2px;font-size:11px}.cubeicon{position:absolute;width:28px;height:28px;left:13px;top:10px;transform:rotate(30deg) skewY(-10deg);border:2px solid #0005}.grass{background:#65b83e}.dirt{background:#95683d}.stone{background:#9da4a7}.wood{background:#b8783b}.leaf{background:#3c9b4d}.sand{background:#dfca78}
    #help{position:absolute;left:22px;bottom:25px;font-size:12px;line-width:1.6;background:#172a3b88;border:1px solid #ffffff25;border-radius:8px;padding:9px 12px}#help kbd{background:#fff2;border:1px solid #fff5;border-radius:3px;padding:1px 5px;margin:0 2px}
    #start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#152635cc;border:1px solid #fff4;border-radius:16px;padding:24px 30px;box-shadow:0 16px 50px #0005;pointer-events:auto;backdrop-filter:blur(8px)}#start h1{margin:0 0 4px;font-size:38px;letter-spacing:-2px}#start p{margin:0 0 18px;color:#dfeaf2}button{border:0;border-radius:8px;background:#ffcf4b;color:#34280a;font-weight:900;padding:12px 22px;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #b98d25}button:active{transform:translateY(3px);box-shadow:0 1px 0 #b98d25}
    #touch{display:none;position:absolute;inset:0;pointer-events:none}.stick,.lookzone{pointer-events:auto}.stick{position:absolute;left:22px;bottom:30px;width:112px;height:112px;border-radius:50%;background:#fff1;border:2px solid #fff5}.stickdot{position:absolute;width:46px;height:46px;border-radius:50%;left:33px;top:33px;background:#fff5;border:2px solid #fff8}.lookzone{position:absolute;right:0;top:0;width:60%;height:78%}
    @media(max-width:700px){#help{display:none}#brand{top:12px;left:12px;font-size:20px}#timeCard{top:12px;right:12px}.slot{width:42px;height:42px}.cubeicon{width:22px;height:22px;left:9px;top:8px}#hotbar{bottom:14px;gap:3px;padding:4px}#touch{display:block}}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div id="brand">VOXEL<span class="branddot">●</span> ISLE</div><div id="timeCard"><div class="timeLabel">Island time</div><div class="timeRow"><span class="sun" id="sunIcon"></span><span id="clock">08:30 AM</span></div></div><div id="crosshair"></div>
    <div id="help"><kbd>WASD</kbd> Move &nbsp; <kbd>SPACE</kbd> Jump<br><kbd>1–6</kbd> Select block &nbsp; <kbd>ESC</kbd> Pause</div>
    <div id="hotbar"></div>
    <div id="start"><h1>Voxel Isle</h1><p>Explore. Build. Survive the night.</p><button id="play">Enter Island</button></div>
    <div id="touch"><div class="stick" id="stick"><div class="stickdot" id="stickdot"></div></div><div class="lookzone" id="lookzone"></div></div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('game'),hud=document.getElementById('start');
let scene,camera,renderer,world,player={x:0,y:7,z:7,vy:0,yaw:0,pitch:-0.12},blocks=[],started=false,held=0;
const types=['grass','dirt','stone','wood','leaf','sand'];
const colors={grass:0x65b83e,dirt:0x95683d,stone:0x9da4a7,wood:0xb8783b,leaf:0x3c9b4d,sand:0xdfca78,water:0x3b9ed3};
function init(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87bde8,28,72);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,180);camera.rotation.order='YXZ';
 renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene.add(new THREE.HemisphereLight(0xbfe3ff,0x61704a,1.8));const sun=new THREE.DirectionalLight(0xfff1bd,2.4);sun.name='sun';sun.position.set(-20,35,-10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-25;sun.shadow.camera.right=25;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-25;scene.add(sun);
 world=new THREE.Group();scene.add(world);buildIsland();buildSky();buildHotbar();addEvents();animate();
}
function box(x,y,z,type,group=world){const g=new THREE.BoxGeometry(.98,.98,.98);const m=new THREE.MeshLambertMaterial({color:colors[type],flatShading:true});const b=new THREE.Mesh(g,m);b.position.set(x,y,z);b.castShadow=true;b.receiveShadow=true;b.userData={type,x,y,z,baseX:x,baseY:y,baseZ:z};group.add(b);blocks.push(b);return b}
function buildIsland(){
 for(let x=-16;x<=16;x++)for(let z=-16;z<=16;z++){const d=Math.sqrt(x*x+z*z);if(d<15.8){const h=Math.floor(2+2*Math.sin(x*.38)*Math.cos(z*.28)+1.2*Math.sin(z*.5))+Math.floor(Math.max(0,4-d*.35));for(let y=-2;y<=h;y++){let t=y===h?'grass':(y>h-2?'dirt':'stone');box(x,y,z,t)}if(d>12.8&&h<3)for(let y=-1;y<h;y++)box(x,y,z,'sand');}}
 // water disc
 const waterMat=new THREE.MeshLambertMaterial({color:colors.water,transparent:true,opacity:.78,flatShading:true});const water=new THREE.Mesh(new THREE.CylinderGeometry(28,28,.8,48),waterMat);water.position.y=-2.15;water.receiveShadow=true;scene.add(water);
 // trees
 [[-8,-7],[7,-8],[10,4],[-4,9],[1,-12]].forEach(([x,z])=>{let y=groundHeight(x,z);for(let i=1;i<=4;i++)box(x,y+i,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)if(Math.abs(dx)+Math.abs(dz)<4)for(let dy=3;dy<5;dy++)if(!(dx===0&&dz===0&&dy===3))box(x+dx,y+dy,z+dz,'leaf')});
 // hut
 let hx=-10,hz=7,hy=groundHeight(hx,hz);for(let x=hx;x<hx+5;x++)for(let z=hz;z<hz+5;z++)box(x,hy,z,'dirt');for(let y=1;y<=3;y++)for(let x=hx;x<hx+5;x++){box(x,hy+y,hz,'wood');box(x,hy+y,hz+4,'wood')}for(let z=hz;z<hz+5;z++){box(hx,hy+1,z,'wood');box(hx+4,hy+1,z,'wood')}for(let y=1;y<=4;y++)for(let x=hx;x<hx+5;x++)box(x,hy+y,hz+2,'wood');
}
function groundHeight(x,z){let h=-99;blocks.forEach(b=>{if(b.userData.x===Math.round(x)&&b.userData.z===Math.round(z)&&b.userData.y>h&&b.userData.type==='grass')h=b.userData.y});return h}
function buildSky(){const geo=new THREE.SphereGeometry(95,24,12);const mat=new THREE.MeshBasicMaterial({color:0x87cbe8,side:THREE.BackSide,depthWrite:false});const sky=new THREE.Mesh(geo,mat);sky.name='sky';scene.add(sky);const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.88});for(let i=0;i<10;i++){const c=new THREE.Group();for(let j=0;j<5;j++){const m=new THREE.Mesh(new THREE.BoxGeometry(3+Math.random()*3,1,1.5),cloudMat);m.position.set(j*2.2,(Math.random()-0.5)*.5,0);c.add(m)}c.position.set(-40+i*9,18+(i%3)*2,-25+(i%4)*12);c.name='cloud';scene.add(c)}
}
function buildHotbar(){const hb=document.getElementById('hotbar');types.forEach((t,i)=>{const s=document.createElement('div');s.className='slot'+(i===0?' active':'');s.innerHTML=`<div class="cubeicon ${t}"></div><b>${i+1}</b>`;s.onclick=()=>selectSlot(i);hb.appendChild(s)})}
function selectSlot(i){held=i;document.querySelectorAll('.slot').forEach((e,j)=>e.classList.toggle('active',i===j))}
const keys={};function addEvents(){document.getElementById('play').onclick=()=>{started=true;hud.style.display='none';canvas.requestPointerLock?.()};document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){player.yaw-=e.movementX*.0024;player.pitch-=e.movementY*.0021;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch))}});document.addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-6]$/.test(e.code))selectSlot(+e.code.slice(-1)-1)});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousedown',e=>{if(!started)return;if(document.pointerLockElement!==canvas)canvas.requestPointerLock?.();else minePlace(e.button)});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 setupTouch();}
function minePlace(button){const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(blocks,false);if(!hits.length)return;const hit=hits[0];if(button===0&&hit.distance<7){world.remove(hit.object);blocks.splice(blocks.indexOf(hit.object),1)}else if(button===2&&hit.distance<7){const p=hit.object.userData,n=hit.face.normal;box(p.x+n.x,p.y+n.y,p.z+n.z,types[held])}}
canvas.addEventListener('contextmenu',e=>e.prevent); 
function setupTouch(){const stick=document.getElementById('stick'),dot=document.getElementById('stickdot');let moveId=null,moveV={x:0,y:0};stick.ontouchstart=stick.ontouchmove=e=>{e.preventDefault();const t=[...e.touches].find(q=>q.target.closest('#stick'));if(!t)return;const r=stick.getBoundingClientRect(),x=t.clientX-r.left-56,y=t.clientY-r.top-56,l=Math.hypot(x,y),s=l>40?40/l:1;moveV={x:x*s,y:y*s};dot.style.transform=`translate(${moveV.x}px,${moveV.y}px)`};stick.ontouchend=()=>{moveV={x:0,y:0};dot.style.transform=''};window.touchMove=moveV;let last=null;document.getElementById('lookzone').ontouchstart=document.getElementById('lookzone').ontouchmove=e=>{e.prevent();const t=e.touches[0];if(!t)return;if(last){player.yaw-= (t.clientX-last.x)*.008;player.pitch-= (t.clientY-last.y)*.008;player.pitch=Math.max(-1.45,Math.min(1.45,player.pitch))}last={x:t.clientX,y:t.clientY}};document.getElementById('lookzone').ontouchend=()=>last=null;
 window.touchMoveAccessor=()=>moveV;
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.033,clockDelta());update(dt);renderCycle();camera.position.set(player.x,player.y,player.z);camera.rotation.set(player.pitch,player.yaw,0);renderer.render(scene,camera)}
let lastTime=performance.now();function clockDelta(){const n=performance.now(),d=(n-lastTime)/1000;lastTime=n;return d}
function update(dt){if(!started)return;let f=(keys.KeyW||0)-(keys.KeyS||0),side=(keys.KeyD||0)-(keys.KeyA||0);if(window.touchMoveAccessor){const m=window.touchMoveAccessor();f-=m.y/40;side+=m.x/40}const speed=keys.ShiftLeft?7:4.5,cy=Math.cos(player.yaw),sy=Math.sin(player.yaw);const dx=( -sy*f + cy*side)*speed*dt,dz=(-cy*f - sy*side)*speed*dt;player.x+=dx;player.z+=dz;const base=groundHeight(player.x,player.z)+1.8;if(player.y<=base||base>player.y){if(keys.Space&&player.y<=base+.08)player.vy=7}player.vy-=16*dt;player.y+=player.vy*dt;if(player.y<base){player.y=base;player.vy=0}}
let day=0.31;function renderCycle(){day=(day+.000018)%1;const angle=day*Math.PI*2-Math.PI/2;const sun=scene.getObjectByName('sun'),sky=scene.getObjectByName('sky');sun.position.set(Math.cos(angle)*32,Math.sin(angle)*38,10);const daylight=Math.max(0,Math.sin(angle));sun.intensity=.12+daylight*2.3;scene.getObjectByName('HemisphereLight');scene.children.forEach(o=>{if(o.isHemisphereLight)o.intensity=.25+daylight*1.55});sun.color.setHex(daylight>.15?0xfff1bd:0xff6e62);
 const dawn=day<.22||day>.78;const skyCol=dawn?new THREE.Color(day<.5?0xe89872:0x7186a7):new THREE.Color().lerpColors(new THREE.Color(0x17233e),new THREE.Color(0x87cbe8),daylight);sky.material.color.copy(skyCol);scene.fog.color.copy(skyCol);
 document.getElementById('sunIcon').style.background=daylight>.2?'#ffe478':'#dce4ff';document.getElementById('sunIcon').style.boxShadow=daylight>.2?'0 0 12px #fff59a':'0 0 12px #aebfff';const hours=(day*24+6)%24,h=Math.floor(hours),m=Math.floor((hours-h)*60),ampm=h>=12?'PM':'AM',hh=(h%12)||12;document.getElementById('clock').textContent=`${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
 scene.children.forEach(o=>{if(o.name==='cloud')o.position.x+=.003;if(o.position&&o.name==='cloud'&&o.position.x>50)o.position.x=-50})}
init();
</script>
</body>
</html>
